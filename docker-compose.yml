services:
  web:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      - DB_PATH=/srv/app/data/db.sqlite3
      - DJANGO_DEBUG=false
      - DJANGO_SSL_REDIRECT=false
      - DJANGO_TRUST_X_FORWARDED_PROTO=true
      - TRUSTED_PROXY_COUNT=1
    volumes:
      - app_data:/srv/app/data
      - ./backups:/srv/app/backups
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  app_data:
  caddy_data:
  caddy_config:
